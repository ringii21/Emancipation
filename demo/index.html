JA.L={1:{
 titre:"第一部",
 intro:"45段落。ハアネルは、次へ進む前にこの部を一週間かけて何度も読み返すよう求めます。各段落の下に、それが何を言っているのかを添えました。1912年の英語原典からの翻訳です。",
 p:[
[1,`豊かなものはさらに引き寄せる——これは存在のあらゆる次元で真実です。そして失うことがより大きな喪失を招くこともまた、同じように確かです。`,
`約束ではなく、観察から始まります。動きは両方向に自らを強めていく。上がるものは上がりつづけ、崩れるものは崩れつづける。<strong>本書全体が、たったひとつの問いへの答えです——どうすれば向きを変えられるのか。</strong>`],
[2,`心は創造します。生活の条件、環境、人生で経験することのすべては、わたしたちがふだん保っている心の姿勢の結果です。`,
`鍵になる語は<strong>ふだん</strong>です。奮い立って一度考えたことではなく、気づかないまま大半の時間に考えていること。決意ではなく、あなたの心の平常の天気です。`],
[3,`その姿勢は、何を考えるかによって決まります。だからあらゆる力、あらゆる達成、あらゆる所有の秘密は、考え方のなかにあります。`,
`第2段落の言い換えです。ハアネルは週に一度、郵便でレッスンを送っていました。読者は前のページを手元に持っていないので、彼はよく繰り返します。前の段落の繰り返しに見えるときは、たいていそのとおりです——読み飛ばして構いません。`],
[4,`なぜか。為すには、まず在らねばならないからです。わたしたちは自分が在るぶんだけしか為せず、何で在るかは何を考えるかによって決まります。`,
`彼の連鎖の全体——<strong>考える → 在る → 為す</strong>。多くの方法は「為す」から入ります（行動を変えよ）。彼はそれでは保たないと言います。行動はいつも、自分が何で在るかの水準まで戻ってくるから。異論はありうる主張ですが、これが彼の論題で、残りはすべてここから出ます。`],
[5,`持っていない力を表すことはできません。それを手にする唯一の道は、その力を意識することです。そして意識できるのは、あらゆる力は内から来ると理解したあとだけです。`,
`循環論法に見えますし、少しそのとおりです。彼が狙っているのはこうです。<strong>持っていると知らない能力は使えない。</strong>最初の行為は獲得ではなく、認めることです。`],
[6,`内なる世界があります。思考と感情と力の世界。光と生命と美の世界。目には見えませんが、その力は大きい。`,
`「内なる世界」はこの部だけで三十回ほど出てきます。神秘的な話ではありません。あたまのなかで起きていることすべて、という意味です。対する「外の世界」は、外で起きていることすべて。<strong>この二語を覚えてください。本全体の骨組みです。</strong>`],
[7,`内なる世界は心が支配します。それを見いだすことは、あらゆる問題の解と、あらゆる結果の原因を見いだすことです。そしてそれはわたしたちに委ねられているのですから、力と所有のすべての法もまた、わたしたちに委ねられています。`,
`効いているのは<strong>「委ねられているのですから」</strong>です。内側は、あなたに手のある唯一の領域。ここから先すべての実践的な土台であり、ついでに言えば、彼の十八世紀前のストア派の土台でもあります。`],
[8,`外の世界は内なる世界を映します。外に現れるものは、内に見いだされたものです。内なる世界には無限の知恵、無限の力、必要なあらゆるものの無限の蓄えがあり、いずれも展開し表現されるのを待っています。この潜在を認めることが、それを外で形にすることです。`,
`本書の中心となる定式であり、一世紀後にロンダ・バーンが引き継ぐものです。<strong>強い意味で取れば（「わたしの状況は思考の正確な反映だ」）、これは誤りで、しかも人を責めます。</strong>解雇や死別を望んで考える人はいません。使える意味で取ればこうです。何に気づき、何を試み、何を断り、何に耐えるかは、内側の状態によって変わる。そしてそれは年単位で、実際に人生をかたちづくります。`],
[9,`内なる調和は外に映ります——調和した状況、心地よい環境、あらゆるものの最善が。それは健康の土台であり、あらゆる偉大さ、あらゆる力、あらゆる達成に欠かせない条件です。`,
`「調和」は彼の愛用語で、はっきり定義されることがありません。もっとも忠実な意味は<strong>内的な葛藤がないこと</strong>。引き裂かれていない、自分と戦っていない、ということです。`],
[10,`内なる調和とは、自分の思考を統御し、ある経験が自分に及ぼす効果を自分で決める力のことです。`,
`前の段落に欠けていた定義がここにあり、はるかに正確です。調和とは「気分がよいこと」ではありません。<strong>あることが自分に及ぼす効果を、自分で決めること。</strong>感情ともっとうまく付き合いたいと言うとき、あなたが探しているものの正確な定義です。`],
[11,`それは楽観と豊かさを生みます。内なる豊かさが、外の豊かさを生みます。`,`第9段落の言い換えです。`],
[12,`外の世界は、内なる意識の状況と状態を映します。`,`第8段落の言い換えです。復習が二段落続きます——速く読んで構いません。`],
[13,`内に知恵を見いだせば、そこに眠る可能性を見わける眼と、それを外に現す力が得られます。`,`彼の順序の第一段階——<strong>見わけること</strong>。`],
[14,`この内なる知恵を意識するにつれ、わたしたちはそれを心のなかで所有します。そしてその心の所有が、もっとも十全で調和のとれた発展に必要なものを現すための力と知恵を、実際に所有させます。`,
`彼の三段階——<strong>意識する → 心で所有する → 実際に所有する</strong>。第五週から教える視覚化の骨格そのものです。書きとめてください。構造を示す数少ない箇所です。`],
[15,`内なる世界は実践的な世界です。力ある人々が勇気・希望・熱意・自信・信を生み出すのはそこであり、それらが、構想を見る知性と、それを現実にする技量を与えます。`,
`<strong>実践的</strong>という語に注目してください。彼は夢想家という非難に対して自分の陣地を守っています。彼にとって内側とは、行動に不可欠な勇気と自信をつくる工房です。この点で彼を間違いだと言うのは難しい。`],
[16,`人生は展開であって、蓄積ではありません。外から来るものは、すでに内に持っているものです。`,
`<strong>「積むのではなく、ひらく」。</strong>新しいものを積み上げるのではなく、すでにそこにあるものを広げる。建築ではなく種のたとえです。本書を通じて繰り返されます——覚えておくと、なぜ彼が何かを足せと決して言わないのかがわかります。`],
[17,`あらゆる所有は意識に基づいています。あらゆる獲得は集める意識の結果であり、あらゆる喪失は散らす意識の結果です。`,
`第1段落の言い換えですが、今度は原因つきです。上がるか下がるかを決めるのは、集める心か、散らす心か。彼がのちに<strong>集中</strong>と呼ぶものを、まだ名づけずにここで置いています。`],
[18,`心のはたらきは調和に依ります。不調和は混乱を生みます。ですから力を得ようとする者は、自然の法と一致していなければなりません。`,
`訳せばこうです。<strong>自分と争っているとき、人はうまく考えられない。</strong>口論の直後に仕事をしようとしたことがある人なら、誰でも確かめられます。`],
[19,`外の世界と結ばれているのは客観的な心を通してです。脳がその器官であり、脳脊髄神経系が体のあらゆる部分と意識的な連絡をとらせます。この系統は、光・熱・におい・音・味のあらゆる感覚に応じます。`,
`ここから本書でもっとも古びた箇所が始まります（19〜23）。ハアネルは1912年の生理学に寄りかかって、自説に科学の裏づけを与えようとします。<strong>解剖学の細部は古いか、端的に誤りです。</strong>ただし彼が示そうとしている考え——わたしたちには意図的な回路と自動的な回路のふたつがある——は今も通用し、現在いう熟慮的思考と自動的思考におおむね対応します。<strong>この五段落は、解剖ではなく考えのために読んでください。</strong>`],
[20,`この心が正しく考えるとき、真実を理解するとき、この系統を通して体へ送る思考が建設的であるとき、感覚は快く、調和しています。`,
`彼の論証の前半——同じ扉が、よいものを通し……`],
[21,`そのときわたしたちは、力と活力と建設的なエネルギーを内に築きます。しかし同じ客観的な心を通して、苦悩・病・欠乏・限界・あらゆる不調和が人生に入ってきます。ですから誤って考えることによって、わたしたちはあらゆる破壊的な力とも結ばれるのです。`,
`……そして悪いものも通す。だから彼は第二部で、意識的な心を<strong>「門の番人」</strong>と呼びます。その役目は生み出すことではなく、選り分けることです。この呼び名は覚えておいてください、何度も出てきます。`],
[22,`内なる世界と結ばれているのは潜在意識を通してです。太陽神経叢がその器官であり、交感神経系があらゆる主観的な感覚——喜び、恐れ、愛、情動、呼吸、想像、その他すべての潜在意識の現象——をつかさどります。潜在意識を通して、わたしたちは普遍の心と結ばれ、宇宙の無限に建設的な力と関係づけられます。`,
`<strong>太陽神経叢が潜在意識の座である、というのは解剖学的に誤りです。</strong>ただし彼が描いている経験は本物です。恐れも喜びも、まず腹で感じられる。彼は本当の感覚を、仕組みだと取り違えました。彼の時代に典型的な誤りで、どこか憎めないものでもあります。`],
[23,`人生の大きな秘密は、このふたつの中心を協調させ、その働きを理解することにあります。この知識があれば、客観的な心と主観的な心を意識的に協力させ、有限と無限を調和させられます。わたしたちの未来は完全にわたしたちの手のなかにあります。気まぐれで不確かな外の力に委ねられてはいません。`,
`最後の一文が、この本を魅力的にも危険にもしています。<strong>「完全にわたしたちの手のなかに」は誤りです</strong>——病があり、他人があり、偶然があり、生まれた時代があります。けれども逆の言明（「わたしは何も左右できない」）はもっと誤りで、はるかに人を動けなくします。<strong>この一文は、正確な計測ではなく、傾きを直すおもりとして読んでください。</strong>`],
[24,`誰もが一致しています。ひとつの原理、ひとつの意識が宇宙全体に行きわたり、あらゆる空間を占め、存在するどの点においても本質的に同一である、と。それは全能であり、全知であり、つねに在ります。あらゆる思考とあらゆるものがそのなかにあります。それはすべてのなかのすべてです。`,
`ここから形而上学が始まり、24〜42段落を占めます。<strong>「誰もが一致しています」は修辞です。</strong>いいえ、誰もが一致してはいません。同意してもよいですし、彼が自分の方法を正当化するために必要とした枠組みとして読んでもかまいません。<strong>本書のどの練習も、これを信じることを求めていません。</strong>`],
[25,`宇宙には考えることのできる意識がひとつしかありません。そしてそれが考えるとき、その思考はそれにとって客観的なものになります。遍在するのですから、それは必然的に各人のうちにもあります。ですから誰もが、この全能・全知・遍在する意識の現れです。`,
`ひとつの心をめぐる四段落の第一。`],
[26,`宇宙に考えられる意識がひとつしかないのなら、あなたの意識は普遍の意識と同一である、という結論が必然的に導かれます。言いかえれば、すべての心はひとつの心です。この結論を逃れることはできません。`,
`<strong>「この結論を逃れることはできない」</strong>——これは主張であって、論証ではありません。ハアネルは哲学者ではなく経営者の確信をもって書きます。彼にできる最大の批判はここで、ついていけない自分が愚かだと感じる前に、早めに見ておくほうがよい点です。`],
[27,`あなたの脳細胞に集まっている意識は、ほかの誰の脳細胞に集まっている意識とも同じものです。誰もが、普遍なるもの、宇宙的な心の個別化にすぎません。`,`第26段落の言い換えです。`],
[28,`普遍の心は静的な、あるいは潜在的なエネルギーです。それはただ在ります。それは個を通してしか現れず、個もまたそれを通してしか現れません。ふたつはひとつです。`,
`形而上学を脇に置いたとき、25〜28段落から持ち帰るべきものはこれです。<strong>あなたの潜在能力は誰より低いのではなく、訓練が少ないだけ。</strong>第十二週で彼はこれを正面から取り上げます。`],
[29,`個が考える力とは、普遍なるものにはたらきかけ、それを現れさせる力です。人間の意識はこの考える力だけから成っています。心そのものは静的エネルギーの微細な形と見なされ、そこから思考と呼ばれる活動が生じます。思考は心の動的な相です。心は静的エネルギー、思考は動的エネルギー——同じものの二つの相です。ですから思考とは、静的な心が動的な心へ変わることで生じる振動の力です。`,
`当時の物理学から借りた語彙——静的、動的、振動。今日の「量子」と同じで、当時の権威の言葉づかいでした。<strong>裏にある考えは単純です。心は潜在であり、思考はその潜在が動いている状態。</strong>`],
[30,`あらゆる属性の総和が普遍の心に含まれている以上——全能・全知・遍在——それらの属性は、潜在的な形で、つねに各人のうちにあります。ですから個が考えるとき、その思考はその出どころに対応する事実や状態として形をとらざるをえません。`,
`次の段落の準備です。本命はそちら。`],
[31,`ですからあらゆる思考は原因であり、あらゆる状態は結果です。だからこそ、望ましい状態だけを生むために、思考を統御することが絶対に欠かせません。`,
`この部からひとつだけ持ち帰るなら、この段落です。<strong>思考＝原因、状態＝結果。</strong>本書の残り全部が、結果ともみ合うかわりに原因にはたらきかけるための方法です。`],
[32,`あらゆる力は内から来て、完全にあなたの統御下にあります。それは正確な知識と、正確な原理の意図的な行使によって得られます。`,
`一文に<strong>「正確」</strong>が二度。彼は念を押しています。差し出しているのは感激ではなく、手順である、と。この本を、その後継のほぼすべてから分けているのがこの点です。`],
[33,`この法則を完全に理解し、思考の過程を自在にできるようになれば、それをどんな状況にも当てはめられることは明らかでしょう。言いかえれば、あなたはあらゆるものの土台にある全能の法則と、意識的に協力しはじめたことになります。`,`第32段落の言い換えです。`],
[34,`普遍の心は、存在するあらゆる原子の生命の原理です。どの原子もたえずより多くの生命を現そうとしており、どれもが知性を持ち、自分が造られた目的を果たそうとしています。`,
`空想的な生物学です。<strong>速く通り過ぎてください。</strong>この段落はどの練習の前提にもなっていません。`],
[35,`人の大半は外の世界に住み、内なる世界を見いだした者はわずかです。けれども外の世界をつくっているのは内なる世界です。だからそれは創造的であり、外の世界に見いだすもののすべてを、あなたが内でつくったのです。`,`第8段落の言い換えです。`],
[36,`この方式は、外と内のこの関係を理解した瞬間にあなたのものとなる力へ、あなたを導きます。内なる世界が原因、外の世界が結果です。結果を変えるには、原因を変えなければなりません。`,
`この章でもっとも実行に移せる一文——<strong>結果を変えるには、原因を変える。</strong>45段落中で最良の次の段落へつなぐ蝶番です。`],
[37,`これがまったく新しい考えであることに、すぐ気づくでしょう。ほとんどの人は、結果にはたらきかけて結果を変えようとします。ある苦悩を別の苦悩と取り替えているだけだと見えていないのです。不調和を除くには原因を除かねばならず、その原因は内なる世界にしかありません。`,
`第一部でもっとも役に立ち、人生でもっとも確かめやすい箇所です。<strong>内側の働き方をそのままに、仕事を変え、街を変え、相手を変える。</strong>それが彼のいう「ある苦悩を別の苦悩と取り替える」ことです。自分にも、近しい誰かにも、見た覚えがあるはずです。`],
[38,`あらゆる成長は内から来ます。自然のすべてがそれを示しています。どの植物も、どの動物も、どの人間もその証拠です。何世紀もの誤りは、力と強さを外に求めたことでした。`,`第16段落の種のたとえに戻ります。`],
[39,`内なる世界は供給の普遍の源であり、外の世界はその河口です。受け取る力は、この源を——各人がその出口であり、それを通して誰もが互いにひとつである、この無限のエネルギーを——認めることにかかっています。`,
`川のたとえです。源は内、河口は外。彼は第四部・第五部でここから倫理的な帰結を引き出します。<strong>同じ源を分かちあっているのだから、他人を害することは自分を害することだ</strong>と。他人を犠牲にした成功への彼の反論であり、彼はこれをとても大切にしています。`],
[40,`認めることは心のはたらきです。ですから心の行為とは、個が普遍の心にはたらきかける相互作用です。そしてこの心はあらゆる空間に行きわたり、生きるものすべてを動かす知性ですから、この作用と反作用が因果の法則をなします。しかし因果の原理は個のうちにはありません。それは普遍の心のうちにあります。客観的な能力ではなく主観的な過程であり、その結果は無限に多様な状態と経験のなかに見られます。`,
`難しい段落ですが、実の部分は一文に収まります。<strong>原因はあなたではない。あなたはエンジンではなく、スイッチです。</strong>非常に具体的な帰結があり、第十三週で彼はそれを使います——あなたが用意するのは方法ではなく、向きだけです。`],
[41,`生命があるためには心がなければなりません。心なしには何も存在できません。存在するすべては、この唯一の基となる実体の現れであり、そこからそれを通して、すべてが造られ、たえず造りなおされています。`,`次のたとえの用意です。`],
[42,`わたしたちは、計り知れない可塑的な心の実体の海のなかに生きています。この実体はつねに生きて活動し、この上なく鋭敏です。それは心の求めに応じて形をとります。思考が鋳型を、実体が自らを表すための母型をつくります。`,
`彼の中心的なたとえ——<strong>鋳型</strong>。そしてこれが、なぜ視覚化の練習がすべて精密な細部を要求するのかを説明します。ぼやけた鋳型はぼやけた鋳物を生む。形而上学に同意するかどうかにかかわらず、実践上の帰結は正しい。<strong>あいまいな意図は何も生みません。</strong>`],
[43,`価値は適用のなかにしかないこと、そしてこの法則を実践的に理解すれば、貧しさは豊かさに、無知は知恵に、不調和は調和に、圧制は自由に置き換わることを覚えておいてください。物質的にも社会的にも、これよりも大きな恵みはたしかにありません。`,
`練習の前の最後の警告です。<strong>ここまでのすべては、適用しないかぎり何の値打ちもありません。</strong>彼はほとんどの部の終わりでこの一文を繰り返します。おそらくそれが、あなたが長いあいだこの本を手にしながら始められなかった理由でもあります。`],
[44,`ではいよいよ適用に移りましょう。ひとりになれて、邪魔の入らない部屋を選びます。背筋を伸ばし、楽に座ってください。ただし、だらしなくもたれないこと。思考はどこへ向かってもかまいませんが、十五分から三十分のあいだ、体を完全に静止させます。これを三、四日、あるいは一週間続けてください。自分の肉体を完全に統御できるようになるまで。`,
`<strong>今週の練習です。</strong>四十五段落のうちの一段落におさまり、そして本当に大事なのはこれだけです。`],
[45,`多くの人はこれを極端に難しいと感じるでしょう。たやすくできる人もいます。けれども先へ進む用意ができる前に、体を完全に統御することが絶対に欠かせません。来週、次の段階の指示を受け取ります。それまでに、この段階を習得していなければなりません。`,
`彼自身が先へ進めない仕組みを告げています。<strong>アプリは彼の指示をそのまま実行しているだけです。</strong>`]
]}};

let ST={done:{},journal:[],dur:15,lang:'fr',autoVoice:true};
let LG='fr', Wv=W, U=FRUI, Lv=LESSONS;
/* ══════ Voix : enregistrement personnel (IndexedDB) + synthèse ══════ */
const VT={
 fr:{rec:"S'enregistrer",recing:"Enregistrement… appuyer pour arrêter",mine:"Ma voix",
     again:"Réenregistrer",tts:"Voix de l'app",listen:"Écouter la consigne",stop:"Arrêter",
     auto:"Lecture auto de ma voix",noMic:"Micro indisponible sur cet appareil.",
     first:"Première lecture : enregistre-toi paragraphe par paragraphe. Dès la deuxième, tu pourras t'écouter.",
     kept:"Enregistré sur ce téléphone uniquement."},
 ja:{rec:"録音する",recing:"録音中… タップで停止",mine:"自分の声",
     again:"録り直す",tts:"アプリの声",listen:"指示を聞く",stop:"停止",
     auto:"自分の声を自動再生",noMic:"この端末ではマイクを利用できません。",
     first:"最初の通読では、段落ごとに自分の声を録音します。二度目からは、自分の声で聴けます。",
     kept:"録音はこの端末の中だけに保存されます。"}
};
const V=()=>VT[LG]||VT.fr;

const DB={d:null,ok:false,
 async open(){try{
   this.d=await new Promise((res,rej)=>{const r=indexedDB.open('lacle-voice',1);
     r.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('v'))e.target.result.createObjectStore('v')};
     r.onsuccess=e=>res(e.target.result);r.onerror=()=>rej(r.error)});
   this.ok=true}catch(e){this.ok=false}},
 tx(m){return this.d.transaction('v',m).objectStore('v')},
 put(k,b){return new Promise((res,rej)=>{const q=this.tx('readwrite').put(b,k);q.onsuccess=()=>res(1);q.onerror=()=>rej()})},
 get(k){return new Promise(res=>{if(!this.ok)return res(null);const q=this.tx('readonly').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})},
 del(k){return new Promise(res=>{const q=this.tx('readwrite').delete(k);q.onsuccess=()=>res(1);q.onerror=()=>res(0)})},
 keys(){return new Promise(res=>{if(!this.ok)return res([]);const q=this.tx('readonly').getAllKeys();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])})}
};

/* ---- synthèse vocale ---- */
let SPK=false;
function strip(h){const d=document.createElement('div');d.innerHTML=h;
 return d.textContent.replace(/\s+/g,' ').trim()}
function say(t){
 if(!('speechSynthesis' in window))return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);
 u.lang=(LG==='ja')?'ja-JP':'fr-FR'; u.rate=(LG==='ja')?0.95:0.92; u.pitch=1;
 u.onend=()=>{SPK=false;paintVoiceBtns()}; u.onerror=()=>{SPK=false;paintVoiceBtns()};
 SPK=true; speechSynthesis.speak(u); paintVoiceBtns();
}
function hush(){if('speechSynthesis' in window)speechSynthesis.cancel();SPK=false;paintVoiceBtns()}
function paintVoiceBtns(){document.querySelectorAll('.ttsbtn').forEach(b=>{
  b.textContent=(SPK?'■ '+V().stop:'▸ '+(b.dataset.lbl||V().tts))})}
function sayCue(n){ if(SPK){hush();return}
  const w=Wv.find(x=>x.n===n); say(w.t+'. '+strip(w.x)); }

/* ---- enregistrement ---- */
let REC={mr:null,ch:[],key:null,stream:null};
async function recToggle(key,btnId){
 const b=document.getElementById(btnId);
 if(REC.mr&&REC.mr.state==='recording'){REC.mr.stop();return}
 if(!navigator.mediaDevices||!window.MediaRecorder||!DB.ok){alert(V().noMic);return}
 try{
  REC.stream=await navigator.mediaDevices.getUserMedia({audio:true});
 }catch(e){alert(V().noMic);return}
 REC.ch=[];REC.key=key;
 REC.mr=new MediaRecorder(REC.stream);
 REC.mr.ondataavailable=e=>{if(e.data.size)REC.ch.push(e.data)};
 REC.mr.onstop=async()=>{
   const blob=new Blob(REC.ch,{type:REC.mr.mimeType||'audio/mp4'});
   try{await DB.put(REC.key,blob)}catch(e){}
   REC.stream.getTracks().forEach(t=>t.stop());
   REC.mr=null; if(typeof paint==='function'&&document.getElementById('pane-read').classList.contains('act'))paint();
 };
 REC.mr.start();
 if(b){b.textContent='■ '+V().recing;b.classList.add('recing')}
}
let AU=null;
async function playMine(key,btnId){
 if(AU&&!AU.paused){AU.pause();AU=null;const b=document.getElementById(btnId);if(b)b.textContent='▸ '+V().mine;return}
 const blob=await DB.get(key); if(!blob)return;
 AU=new Audio(URL.createObjectURL(blob));
 const b=document.getElementById(btnId);
 if(b)b.textContent='■ '+V().stop;
 AU.onended=()=>{if(b)b.textContent='▸ '+V().mine};
 AU.play().catch(()=>{});
}
async function delMine(key){ if(!DB.ok)return; await DB.del(key); paint(); }
async function toggleAuto(){ ST.autoVoice=!ST.autoVoice; await S.set('mk',ST); paint(); }

function applyLang(){
 LG=ST.lang||'fr';
 U = (LG==='ja') ? JA.ui : FRUI;
 Wv = (LG==='ja') ? W.map((w,i)=>Object.assign({},w,JA.W[i])) : W;
 Lv = (LG==='ja') ? JA.L : LESSONS;
 document.body.classList.toggle('ja', LG==='ja');
 document.documentElement.lang = LG;
 const q=(x)=>document.querySelector(x);
 q('#pane-key .eyebrow').textContent=U.eyebrow;
 q('#pane-key h1').innerHTML=U.h1;
 q('#pane-journal .eyebrow').textContent=U.jEyebrow;
 q('#pane-journal h1').innerHTML=U.jH1;
 q('#pane-soon .eyebrow').textContent=U.sEyebrow;
 q('#pane-soon h1').innerHTML=U.sH1;
 q('#pane-soon .consigne').innerHTML=U.soonBody;
 const nl=document.querySelectorAll('nav .nl');
 nl[0].textContent=U.navKey; nl[1].textContent=U.navJournal; nl[2].textContent=U.navSoon;
 q('.nsoon').textContent=U.soonTag;
 q('.backbtn').textContent=U.quit;
 q('#quit').textContent=U.quitSess;
 document.getElementById('langbtn').textContent=U.langLabel;
}
async function switchLang(){ ST.lang = (ST.lang==='ja')?'fr':'ja'; await S.set('mk',ST); applyLang(); render(); scrollTo(0,0); }

const today=()=>new Date().toISOString().slice(0,10);
const cnt=n=>(ST.done[n]||[]).length;
const didToday=n=>(ST.done[n]||[]).includes(today());
const cur=()=>{for(const w of Wv){if(cnt(w.n)<7)return w.n}return 24};
const total=()=>Wv.reduce((a,w)=>a+cnt(w.n),0);

/* ══════ Rendu ══════ */
function render(){
 const c=cur();
 document.getElementById('dial').innerHTML=Wv.map(w=>{const d=cnt(w.n);
   return `<div class="dweek">${[0,1,2,3,4,5,6].map(i=>`<div class="dot ${i<d?'on':''} ${w.n===c&&i===d?'cur':''}"></div>`).join('')}</div>`}).join('');
 const t=total();
 document.getElementById('dialcap').textContent = t===0
   ? U.start0 : U.day(t,c);

 const w=Wv.find(x=>x.n===c), d=cnt(c), dt=didToday(c);
 let html=`<div class="card">
   <p class="wknum">${U.wk(c)}</p>
   <h2 class="wktitle">${w.t}</h2>
   <div class="consigne">${w.x}</div>
   <p class="src">${w.s} · ${U.src}</p>
   <div class="days">${[0,1,2,3,4,5,6].map(i=>`<div class="day ${i<d?'done':''} ${i===d&&!dt?'today':''}">${i<d?'✓':i+1}</div>`).join('')}</div>
   ${dt?`<button class="btn" disabled>${U.doneToday}</button><button class="btn ghost" onclick="open_(${c})">${U.again}</button>`
       :`<button class="btn" onclick="open_(${c})">${U.begin(d+1)}</button>`}
   ${Lv[c]?(()=>{const P=Lv[c].p.length,pos=(ST.pos||{})[c]||0,lp=(ST.loops||{})[c]||0;
     const lbl = (lp>0 ? U.reread(lp) : pos>0 ? U.resume(pos,P) : U.readIt(P)) + (U.frOnly||'');
     return `<button class="btn ghost" onclick="read(${c})">${lbl}</button>`})():''}
   <div class="vbar"><button class="ttsbtn" data-lbl="${U.listenLbl}" onclick="sayCue(${c})">▸ ${U.listenLbl}</button></div>
   <details><summary>${U.whatMeans}</summary><div class="explain">${w.e}</div></details>
 </div>`;

 const past=Wv.filter(x=>x.n<c);
 if(past.length){html+=`<p class="sechead">${U.doneHead}</p>`+past.map(x=>
   `<div class="row past" onclick="open_(${x.n})"><span class="idx">${x.n}</span><span class="nm">${x.t}</span><span class="st">7/7</span></div>`).join('')}

 const next=Wv.filter(x=>x.n>c);
 if(next.length){html+=`<p class="sechead">${U.lockHead}</p>`+next.map(x=>
   `<div class="row lock"><span class="idx">${x.n}</span><span class="nm">${x.n===c+1?x.t:'—'}</span><span class="st">${x.n===c+1?U.sess(7-d):''}</span></div>`).join('')
   +`<p class="src" style="border:0;margin-top:16px">${U.lockNote}</p>`}

 document.getElementById('weeks').innerHTML=html;

 document.getElementById('journal').innerHTML = ST.journal.length
  ? ST.journal.slice().reverse().map(e=>`<div class="jentry"><p class="jmeta">${e.date} · semaine ${e.week}</p><p class="jtext">${e.txt.replace(/[<>]/g,'')}</p></div>`).join('')
  : `<p class="empty">${U.jEmpty}</p>`;
}

/* ══════ Lecteur pas à pas ══════ */
let RD={part:null,i:0};
function read(n){
 const L=Lv[n];if(!L)return;
 RD.part=n;RD.i=(ST.pos&&ST.pos[n])||0;
 document.querySelectorAll('.pane').forEach(x=>x.classList.remove('act'));
 document.getElementById('pane-read').classList.add('act');
 document.querySelectorAll('nav button').forEach(x=>x.classList.remove('act'));
 document.getElementById('rd-nav').classList.add('on');
 paint();
}
function paint(){
 const L=Lv[RD.part],N=L.p.length,i=RD.i;
 const stage=document.getElementById('rd-stage');

 if(i>=N){ // écran de fin
  const loops=((ST.loops||{})[RD.part]||0);
  document.getElementById('rd-count').textContent=U.partDone;
  document.getElementById('rd-prog').style.width="100%";
  stage.innerHTML=`<div class="done-card">
    <h2>${U.doneH(L.titre)}</h2>
    <p>${U.doneP1}</p>
    <p>${U.doneP2}</p>
    <p class="loops">${U.loops(loops,RD.part)}</p>
  </div>`;
  document.getElementById('rd-prev').disabled=false;
  const nx=document.getElementById('rd-next');
  nx.textContent=U.rereadStart;
  nx.onclick=()=>{RD.i=0;savePos();paint()};
  return;
 }

 const [num,txt,gl]=L.p[i];
 document.getElementById('rd-count').textContent=U.counter(num,i+1,N);
 document.getElementById('rd-prog').style.width=((i+1)/N*100)+'%';
 stage.innerHTML=`
   ${num===44?`<p class="rdtag">${U.exoTag}</p>`:''}
   <p class="rdpara${num===44?' exo':''}">${txt}</p>
   <details class="pgloss"><summary>${U.whatSays}</summary><div class="gtxt">${gl}</div></details>
   <div id="vslot"></div>`;
 voiceBar(num,txt);
 document.getElementById('rd-prev').disabled=(i===0);
 const nx=document.getElementById('rd-next');
 nx.textContent=(i===N-1)?U.finish:U.next;
 nx.onclick=()=>step(1);
 scrollTo(0,0);
}
function step(d){
 const N=LESSONS[RD.part].p.length;
 const nv=RD.i+d;
 if(nv<0)return;
 if(nv>N)return;
 if(nv===N){ // on vient de finir : on compte une lecture
  ST.loops=ST.loops||{};ST.loops[RD.part]=(ST.loops[RD.part]||0)+1;
 }
 RD.i=nv;savePos();paint();
}
function savePos(){ST.pos=ST.pos||{};ST.pos[RD.part]=RD.i;S.set('mk',ST)}
function back(){hush();if(AU){AU.pause();AU=null}
 document.getElementById('rd-nav').classList.remove('on');
 document.querySelectorAll('.pane').forEach(x=>x.classList.remove('act'));
 document.getElementById('pane-key').classList.add('act');
 document.querySelector('nav button[data-p=key]').classList.add('act');
 render();scrollTo(0,0);
}
/* swipe horizontal */
let sx=0;
document.getElementById('pane-read').addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX},{passive:true});
document.getElementById('pane-read').addEventListener('touchend',e=>{
 const dx=e.changedTouches[0].clientX-sx;
 if(Math.abs(dx)>60)step(dx<0?1:-1);
},{passive:true});
document.addEventListener('keydown',e=>{
 if(!document.getElementById('pane-read').classList.contains('act'))return;
 if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);
});

async function voiceBar(num,txt){
 const slot=document.getElementById('vslot'); if(!slot)return;
 const key=`p${RD.part}-${num}`;
 const has=DB.ok ? !!(await DB.get(key)) : false;
 const first=!has;
 slot.innerHTML=`<div class="vbar">
   <button id="vrec" class="${first?'on':''}" onclick="recToggle('${key}','vrec')">● ${first?V().rec:V().again}</button>
   ${has?`<button id="vplay" onclick="playMine('${key}','vplay')">▸ ${V().mine}</button>
          <button class="tiny" onclick="delMine('${key}')">✕</button>`:''}
   <button class="ttsbtn" onclick="say(${JSON.stringify(txt).replace(/'/g,"\\u0027")}.replace(/<[^>]+>/g,''))">▸ ${V().tts}</button>
 </div>
 <div class="autorow"><button class="${ST.autoVoice?'on':''}" onclick="toggleAuto()">${ST.autoVoice?'●':'○'}</button><span>${V().auto}</span></div>
 <p class="vhint">${first?V().first:V().kept}</p>`;
 paintVoiceBtns();
 if(has&&ST.autoVoice&&!SPK)playMine(key,'vplay');
}

/* ══════ Séance ══════ */
let T={w:null,end:0,tot:0,run:false,raf:null,wl:null};
const R=2*Math.PI*46;
document.getElementById('arc').style.strokeDasharray=R;

function open_(n){
 T.w=n;T.run=false;cancelAnimationFrame(T.raf);
 const w=Wv.find(x=>x.n===n);
 document.getElementById('cue').textContent=w.c;
 document.getElementById('picker').innerHTML=[15,20,30].map(m=>`<button class="${m===ST.dur?'sel':''}" onclick="setDur(${m})">${m} min</button>`).join('');
 clock(ST.dur*60,ST.dur*60);
 document.getElementById('startStop').textContent=U.startBtn;
 document.getElementById('session').classList.add('on');
 const sb=document.getElementById('sayCue');
 if(sb){sb.onclick=()=>sayCue(n);sb.textContent='▸ '+U.listenLbl}
}
function setDur(m){ST.dur=m;S.set('mk',ST);open_(T.w)}
function clock(l,t){
 document.getElementById('clock').textContent=`${Math.floor(l/60)}:${String(Math.floor(l%60)).padStart(2,'0')}`;
 document.getElementById('arc').style.strokeDashoffset=R*(1-l/t);
}
function tick(){const l=Math.max(0,(T.end-Date.now())/1000);clock(l,T.tot);
 if(l<=0){done();return}T.raf=requestAnimationFrame(tick)}

document.getElementById('startStop').onclick=async()=>{
 if(!T.run){T.tot=ST.dur*60;T.end=Date.now()+T.tot*1000;T.run=true;
  document.getElementById('startStop').textContent=U.stopBtn;
  try{T.wl=await navigator.wakeLock.request('screen')}catch(e){}
  tick();
 }else{T.run=false;cancelAnimationFrame(T.raf);T.tot=Math.max(1,(T.end-Date.now())/1000);
  document.getElementById('startStop').textContent=(LG==='ja'?'再開':'Reprendre');
  if(T.wl){T.wl.release();T.wl=null}}
};
document.getElementById('quit').onclick=()=>{hush();if(AU){AU.pause();AU=null}T.run=false;cancelAnimationFrame(T.raf);
 if(T.wl){T.wl.release();T.wl=null}document.getElementById('session').classList.remove('on')};

async function done(){
 T.run=false;if(T.wl){T.wl.release();T.wl=null}
 if(navigator.vibrate)navigator.vibrate([90,140,90]);
 ST.done[T.w]=ST.done[T.w]||[];
 if(!ST.done[T.w].includes(today()))ST.done[T.w].push(today());
 await S.set('mk',ST);
 document.getElementById('session').innerHTML=
  `<div style="max-width:400px;width:100%">
     <h2 style="font-family:Fraunces,serif;font-weight:300;font-size:26px;margin:0 0 10px">${U.sessDone}</h2>
     <p class="cue" style="text-align:left;margin:0">${U.sessAsk}</p>
     <textarea id="note" placeholder="${LG==='ja'?'任意':'Optionnel.'}"></textarea>
     <button class="btn" onclick="note(${T.w})">${U.save}</button>
     <button class="btn ghost" onclick="location.reload()">${U.skip}</button>
   </div>`;
}
async function note(w){
 const v=document.getElementById('note').value.trim();
 if(v){ST.journal.push({date:new Date().toLocaleDateString(LG==='ja'?'ja-JP':'fr-FR'),week:w,txt:v});await S.set('mk',ST)}
 location.reload();
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
 document.getElementById('rd-nav').classList.remove('on');
 document.querySelectorAll('nav button').forEach(x=>x.classList.remove('act'));
 document.querySelectorAll('.pane').forEach(x=>x.classList.remove('act'));
 b.classList.add('act');document.getElementById('pane-'+b.dataset.p).classList.add('act');scrollTo(0,0)});

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
(async()=>{await DB.open();const s=await S.get('mk');if(s)ST={...ST,...s};applyLang();render()})();
</script>
